<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Trova DAE - Croce Rossa Italiana</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

:root{
  --cri-red:#e30613;
  --dark:#111827;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#000;
}

/* ================= MAPPA ================= */

#map{
  position:absolute;
  inset:0;
  z-index:1;
}

/* ================= TOP BAR ================= */

.topbar{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);

  z-index:1000;

  background:rgba(227,6,19,0.95);
  color:white;

  padding:14px 24px;

  border-radius:999px;

  font-weight:700;
  font-size:16px;

  backdrop-filter:blur(10px);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.25);

  transition:.3s;
}

/* ================= MENU BUTTON MOBILE ================= */

.menu-btn{
  display:none;

  position:absolute;
  top:15px;
  left:15px;

  z-index:1200;

  width:46px;
  height:46px;

  border:none;
  border-radius:14px;

  background:rgba(227,6,19,0.95);
  color:white;

  font-size:22px;
  cursor:pointer;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.25);

  backdrop-filter:blur(10px);
}

/* ================= SIDEBAR ================= */

.sidebar{

  position:absolute;

  top:80px;
  left:15px;
  bottom:15px;

  width:340px;

  z-index:1100;

  background:rgba(255,255,255,0.88);

  backdrop-filter:blur(18px);

  border-radius:22px;

  overflow:auto;

  padding:16px;

  box-shadow:
    0 10px 35px rgba(0,0,0,0.18);

  transition:.35s;
}

.sidebar h2{
  color:var(--cri-red);
  margin-bottom:14px;
  font-size:22px;
}

/* ================= SEARCH ================= */

.search-box{
  margin-bottom:14px;
}

.search-box input{
  width:100%;

  padding:12px;

  border:none;
  outline:none;

  border-radius:12px;

  background:#f3f4f6;

  font-size:14px;
}

/* ================= CARD ================= */

.card{

  background:white;

  margin:10px 0;
  padding:14px;

  border-radius:16px;

  cursor:pointer;

  transition:.25s;

  border-left:5px solid var(--cri-red);

  box-shadow:
    0 6px 18px rgba(0,0,0,0.08);
}

.card:hover{
  transform:translateY(-2px) scale(1.01);
  background:#fff5f5;
}

.card-title{
  font-weight:700;
  margin-bottom:5px;
  color:#111;
}

.card-info{
  color:#555;
  font-size:13px;
}

/* ================= BUTTON GPS ================= */

.fab{
  position:absolute;

  right:18px;
  bottom:18px;

  z-index:1200;

  background:rgba(227,6,19,0.95);
  color:white;

  border:none;

  padding:15px 18px;

  border-radius:999px;

  font-size:14px;
  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 10px 25px rgba(0,0,0,0.25);

  backdrop-filter:blur(10px);

  transition:.25s;
}

.fab:hover{
  transform:scale(1.04);
}

/* ================= DARK MODE BUTTON ================= */

.dark-btn{
  position:absolute;

  right:18px;
  bottom:78px;

  z-index:1200;

  width:52px;
  height:52px;

  border:none;
  border-radius:50%;

  background:white;

  cursor:pointer;

  font-size:20px;

  box-shadow:
    0 10px 25px rgba(0,0,0,0.25);
}

/* ================= DARK MODE ================= */

body.dark .sidebar{
  background:rgba(17,24,39,0.9);
  color:white;
}

body.dark .card{
  background:#1f2937;
  color:white;
}

body.dark .card-info{
  color:#ddd;
}

body.dark .search-box input{
  background:#374151;
  color:white;
}

body.dark .topbar{
  background:rgba(17,24,39,0.92);
}

/* ================= LEAFLET POPUP ================= */

.leaflet-popup-content-wrapper{
  border-radius:16px;
}

/* ================= MOBILE ================= */

@media (max-width:768px){

  .menu-btn{
    display:block;
  }

  .topbar{
    width:72%;
    font-size:12px;
    padding:12px;
    top:15px;
  }

  .sidebar{

    width:240px;

    top:72px;
    left:10px;
    bottom:10px;

    padding:12px;
  }

  .sidebar.closed{
    transform:translateX(-120%);
  }

  .sidebar h2{
    font-size:17px;
  }

  .card{
    padding:10px;
  }

  .card-title{
    font-size:13px;
  }

  .card-info{
    font-size:11px;
  }

  .fab{
    font-size:12px;
    padding:12px 14px;
  }

  .dark-btn{
    width:46px;
    height:46px;
    bottom:72px;
  }

  .leaflet-popup-content{
    font-size:12px;
  }

}

/* ================= EXTRA SMALL ================= */

@media (max-width:480px){

  .sidebar{
    width:210px;
  }

  .topbar{
    width:68%;
    font-size:11px;
  }

}

</style>
</head>

<body>

<!-- MENU MOBILE -->
<button class="menu-btn" onclick="toggleSidebar()">
☰
</button>

<!-- TOP BAR -->
<div class="topbar">
❤️ Trova DAE - Croce Rossa Italiana
</div>

<!-- MAPPA -->
<div id="map"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

  <h2>Defibrillatori (DAE)</h2>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Cerca DAE..."
    />
  </div>

  <div id="list"></div>

</div>

<!-- DARK MODE -->
<button class="dark-btn" onclick="toggleDarkMode()">
🌙
</button>

<!-- GPS -->
<button class="fab" onclick="locateUser()">
📍 La mia posizione
</button>

<script>

/* ================= MAPPA ================= */

var map = L.map('map',{
  zoomControl:true
}).setView([37.791, 15.209], 14);

/* ================= TILE ================= */

let lightLayer = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'&copy; OpenStreetMap'
  }
).addTo(map);

let darkLayer = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {
    attribution:'&copy; CartoDB'
  }
);

/* ================= ICONA DAE ================= */
/* USO IL TUO MARKER IDENTICO */

var daeIcon = L.divIcon({
  className: "dae-device",
  html: `
    <div style="
      width:44px;
      height:44px;
      background:#e30613;
      border:2px solid #b00510;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 25px rgba(0,0,0,0.25);
      position:relative;
    ">

      <div style="
        position:absolute;
        top:6px;
        width:18px;
        height:10px;
        background:rgba(255,255,255,0.25);
        border-radius:2px;
      "></div>

      <svg width="22" height="22" viewBox="0 0 24 24" style="margin-top:10px;">
        <path d="M13 2L4 14h7l-1 8 10-13h-6l-1-7z"
              fill="#ffffff"/>
      </svg>

    </div>
  `,
  iconSize:[44,44],
  iconAnchor:[22,44]
});

/* ================= DATI ================= */

const daeList=[

 {nome:"Piazza Municipio",lat:37.7915,lng:15.2102,info:"Accesso H24"},
 {nome:"Campo Sportivo",lat:37.789,lng:15.205,info:"Durante eventi"},
 {nome:"Scuola Media",lat:37.793,lng:15.2125,info:"Accesso limitato"},
 {nome:"Centro Civico",lat:37.7902,lng:15.2078,info:"Struttura pubblica"}

];

const list = document.getElementById("list");

let markers=[];

/* ================= MARKERS ================= */

function renderList(filter=""){

  list.innerHTML="";

  markers.forEach(m=>map.removeLayer(m.marker));

  markers=[];

  daeList
  .filter(d=>
    d.nome.toLowerCase().includes(filter.toLowerCase())
  )
  .forEach(d=>{

    let marker = L.marker(
      [d.lat,d.lng],
      {icon:daeIcon}
    )
    .addTo(map)
    .bindPopup(`
      <div style="min-width:160px">
        <b style="color:#e30613;font-size:16px;">
          DAE
        </b>
        <br><br>

        <b>${d.nome}</b>
        <br>

        ${d.info}
      </div>
    `);

    markers.push({marker,d});

    let card=document.createElement("div");

    card.className="card";

    card.innerHTML=`
      <div class="card-title">
        ${d.nome}
      </div>

      <div class="card-info">
        ${d.info}
      </div>
    `;

    card.onclick=()=>{

      map.flyTo(
        [d.lat,d.lng],
        18,
        {
          duration:1.5
        }
      );

      marker.openPopup();

      if(window.innerWidth <= 768){
        sidebar.classList.add("closed");
      }

    };

    list.appendChild(card);

  });

}

renderList();

/* ================= SEARCH ================= */

document
.getElementById("searchInput")
.addEventListener("input",e=>{
  renderList(e.target.value);
});

/* ================= GPS ================= */

function locateUser(){

  map.locate({
    setView:true,
    maxZoom:17,
    enableHighAccuracy:true
  });

}

map.on('locationfound',e=>{

  L.circle(e.latlng,{

    radius:50,

    color:'#e30613',

    fillColor:'#e30613',

    fillOpacity:0.2

  })
  .addTo(map)
  .bindPopup("📍 Sei qui");

});

/* ================= SIDEBAR MOBILE ================= */

const sidebar=document.getElementById("sidebar");

function toggleSidebar(){
  sidebar.classList.toggle("closed");
}

/* ================= DARK MODE ================= */

let dark=false;

function toggleDarkMode(){

  dark=!dark;

  if(dark){

    map.removeLayer(lightLayer);

    darkLayer.addTo(map);

    document.body.classList.add("dark");

  }else{

    map.removeLayer(darkLayer);

    lightLayer.addTo(map);

    document.body.classList.remove("dark");

  }

}

/* ================= AUTO CLOSE MOBILE ================= */

if(window.innerWidth <= 768){
  sidebar.classList.add("closed");
}

</script>

</body>
</html>
